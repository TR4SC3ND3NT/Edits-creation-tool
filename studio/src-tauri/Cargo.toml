[package]
name = "edits-studio"
version = "0.1.0"
description = "Edits Studio: the desktop app of the edits engine (Tauri + React + shadcn/ui)"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "edits-studio"

# Not a member of the root workspace (see `exclude` there): building this
# needs WebKitGTK, and `cargo test --workspace` must not.
[workspace]

[lib]
name = "edits_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "edits-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
edits-core = { path = "../../crates/edits-core" }
edits-render = { path = "../../crates/edits-render" }
# Compare a render with a reference analysis (the library of `edits-analyze compare`).
edits-analyze = { path = "../../crates/edits-analyze" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
notify = "8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
