[package]
name = "edits-analyze"
description = "Reference analysis for the edits engine: extract a content-independent recipe (beats, cuts, flashes, tone, blur, motion) from a finished edit, draft a project from it, and compare renders in signature space"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "edits-analyze"
path = "src/main.rs"

[dependencies]
edits-core = { path = "../edits-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rustfft = "6"
rayon = "1"
