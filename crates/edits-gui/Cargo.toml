[package]
name = "edits-gui"
description = "Desktop window for the edits engine: preview, transport, timeline and live reload of a project an agent is editing"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "edits_gui"
path = "src/lib.rs"

[[bin]]
name = "edits-gui"
path = "src/main.rs"

[dependencies]
edits-core = { path = "../edits-core" }
edits-render = { path = "../edits-render" }
anyhow.workspace = true
# The window draws through OpenGL (glow): see docs/GUI.md for why.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[dev-dependencies]
serde_json.workspace = true
