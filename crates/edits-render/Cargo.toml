[package]
name = "edits-render"
description = "Headless GPU renderer for the edits engine (wgpu, WGSL)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
edits-core = { path = "../edits-core" }
anyhow.workspace = true
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "gif"] }

[dev-dependencies]
serde_json.workspace = true
