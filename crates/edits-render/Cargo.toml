[package]
name = "edits-render"
description = "Headless GPU renderer for the edits engine (wgpu, WGSL)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
edits-core = { path = "../edits-core" }
anyhow.workspace = true
serde.workspace = true
wgpu = "30"
# The WGSL front end wgpu already uses, for checking custom effect shaders without a GPU.
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "gif"] }
# Text layers: font tables and glyph outlines (skrifa), shaping (harfrust, a port of HarfBuzz)
# and rasterisation of outlines to coverage masks (zeno). Line breaking and alignment are ours
# (`text.rs`): see docs/RENDERING.md for why not parley.
skrifa = "0.44"
harfrust = "0.12"
zeno = "0.3"
# Shape layers: bezier paths, arc lengths, stroking, dashes and offsetting (kurbo); the
# outlines are rasterised by zeno like glyphs. See `src/shape/mod.rs`.
kurbo = "0.13"

[dev-dependencies]
serde_json.workspace = true
