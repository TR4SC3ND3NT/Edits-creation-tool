[package]
name = "edits-mcp"
description = "MCP server for the edits engine: a thin stdio adapter over the `edits` and `edits-analyze` executables"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "edits_mcp"
path = "src/lib.rs"

[[bin]]
name = "edits-mcp"
path = "src/main.rs"

[dependencies]
edits-core = { path = "../edits-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
