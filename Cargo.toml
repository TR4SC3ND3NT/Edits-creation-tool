[workspace]
resolver = "2"
members = ["crates/*"]
# The desktop app (Tauri) has its own lockfile and needs WebKitGTK to build;
# keep it out so `cargo test --workspace` never needs it. See docs/GUI.md.
exclude = ["studio/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TR4SC3ND3NT/Edits-creation-tool"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1
